[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "akeyless-foundry-runtime"
version = "0.1.0"
description = "Fetch Akeyless secrets at runtime on Microsoft Foundry Hosted Agents using Azure AD cloud identity"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Akeyless Community" }]
keywords = ["akeyless", "foundry", "azure", "entra", "secrets", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "akeyless>=5.0.0",
    "akeyless-cloud-id>=0.3.1",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.9.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
all = [
    "mcp>=1.9.0",
]

[project.scripts]
akeyless-foundry-mcp = "akeyless_foundry.tools.mcp:run_mcp_server"

[project.urls]
Homepage = "https://github.com/akeyless-community/foundry-akeyless-runtime"
Repository = "https://github.com/akeyless-community/foundry-akeyless-runtime"

[tool.hatch.build.targets.wheel]
packages = ["src/akeyless_foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
